services:
  - type: web
    name: culturesync
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: QLOO_API_KEY
        sync: false 
      - key: GEMINI_API_KEY
        sync: false
      - key: QLOO_BASE_URL
        value: https://hackathon.api.qloo.com
      - key: AGENT_MODEL
        value: gemini-flash-latest,gemini-3.5-flash,gemini-3.1-flash-lite
      - key: AGENT_DAILY_LIMIT
        value: "50"
 